server:
  port: 8081

spring:
  application:
    name: ticket-service
  datasource:
    url: ${TICKETS_DB_URL:jdbc:postgresql://localhost:5432/tickets}
    username: ${DB_USER:triage}
    password: ${DB_PASSWORD:triage}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # Fail fast when the broker is down (the default blocks for 60s); the outbox or the listener retries.
        max.block.ms: 5000
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
